name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site folder
        env:
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
        run: |
          mkdir _site
          cp -r index.html favicon.svg css js assets _site/
          # Generate the real config from the repository secret.
          # Note: the key still ends up in the public JavaScript. See README.
          printf 'window.WEATHER_CONFIG = { API_KEY: "%s", API_BASE: "https://api.weatherapi.com/v1", DEFAULT_CITY: "Cairo" };\n' "$WEATHER_API_KEY" > _site/js/config.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
